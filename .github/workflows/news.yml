name: انتشار اخبار استخدامی

on:
  schedule:
    - cron: "*/30 3-19 * * *"   # هر ۳۰ دقیقه، از ۶:۳۰ صبح تا ۱۱:۳۰ شب به وقت ایران
  workflow_dispatch:            # دکمه‌ی اجرای دستی

permissions:
  contents: write   # برای ذخیره‌ی فهرست خبرهای منتشرشده (seen.json)
  models: read      # هوش مصنوعی رایگان GitHub

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@azmoonyar_estekhdam"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL: ${{ secrets.BALE_CHANNEL }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHANNEL: ${{ secrets.EITAA_CHANNEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_DISABLED: "1"   # سرویس هوش مصنوعی GitHub فعلاً پاسخ نمی‌دهد
        run: python debug_ee.py || true; MAX_POSTS_PER_RUN=0 python bot.py
      - name: Save seen list
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git pull --rebase -q && git push)
