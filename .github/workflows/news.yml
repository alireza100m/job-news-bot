name: انتشار اخبار استخدامی

on:
  schedule:
    - cron: "*/30 3-19 * * *"   # هر ۳۰ دقیقه، از ۶:۳۰ صبح تا ۱۱:۳۰ شب به وقت ایران
  workflow_dispatch:            # دکمه‌ی اجرای دستی
    inputs:
      dry_run:
        description: "فقط پیش‌نمایش (چیزی ارسال و ذخیره نشود)"
        default: "0"

permissions:
  contents: write   # برای ذخیره‌ی فهرست خبرهای منتشرشده (seen.json)
  models: read      # هوش مصنوعی رایگان GitHub

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Persian text shaping for post images
        run: |
          python -c "from PIL import features; print('raqm', features.check('raqm'))" | grep -q True || (sudo apt-get install -y -q libfribidi0 || (sudo apt-get update -q && sudo apt-get install -y -q libfribidi0)) || true
          python -c "import image; print('post image ok', len(image.make_image('آزمون استخدامی آموزش و پرورش')), 'raqm', image.available())" || true
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@azmoonyar_estekhdam"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL: ${{ secrets.BALE_CHANNEL }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHANNEL: ${{ secrets.EITAA_CHANNEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_DISABLED: "1"   # سرویس هوش مصنوعی GitHub فعلاً پاسخ نمی‌دهد
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python bot.py
      - name: Save seen list
        if: ${{ inputs.dry_run != '1' }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json tracked.json pinned.json mirror_map_bot.json 2>/dev/null || git add seen.json tracked.json
          git diff --cached --quiet || (git commit -m "update seen" && git pull --rebase -q && git push)
