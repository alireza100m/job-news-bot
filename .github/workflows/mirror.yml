name: بازنشر پست‌های دستی در بله و ایتا

on:
  schedule:
    - cron: "*/30 * * * *"   # هر اجرا ~۵.۵ ساعت فعال می‌ماند؛ اجرای بعدی در صف منتظر می‌ماند
  workflow_dispatch:

permissions:
  contents: write   # ذخیره‌ی mirror_map.json برای حذف خودکار

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Mirror manual posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@azmoonyar_estekhdam"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL: ${{ secrets.BALE_CHANNEL }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHANNEL: ${{ secrets.EITAA_CHANNEL }}
          MIRROR_MINUTES: "330"
          MIRROR_SINCE: "1794468300"   # پست‌های قبل از راه‌اندازی بازنشر نمی‌شوند
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          python -u mirror.py
