name: انتشار دوباره‌ی پست‌های پیگیری

on:
  workflow_dispatch:
    inputs:
      reminders:
        description: "بخشی از عنوان آزمون‌ها برای یادآوری مهلت، جدا با |"
        default: ""
      weekly:
        description: "جمع‌بندی هفتگی هم منتشر شود؟ (1 = بله)"
        default: "0"
      quiz:
        description: "یک سؤال کوییز همین الان؟ (1 = بله)"
        default: "0"
      edu:
        description: "پست آموزشی همین الان: tip / mistake / skill / exam (چند نوع با فاصله)"
        default: ""
      tg_only:
        description: "فقط تلگرام (بدون بله و ایتا)؟ (1 = بله)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Repost
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@azmoonyar_estekhdam"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL: ${{ secrets.BALE_CHANNEL }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHANNEL: ${{ secrets.EITAA_CHANNEL }}
          REPOST_REMINDERS: ${{ inputs.reminders }}
          REPOST_WEEKLY: ${{ inputs.weekly }}
          REPOST_QUIZ: ${{ inputs.quiz }}
          REPOST_EDU: ${{ inputs.edu }}
          REPOST_TG_ONLY: ${{ inputs.tg_only }}
        run: python repost.py
      - name: Save state
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add quiz_state.json tracked.json edu_state.json 2>/dev/null || git add quiz_state.json tracked.json
          git diff --cached --quiet || (git commit -m "update quiz state" && git pull --rebase -q && git push)
